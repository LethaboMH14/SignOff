name: CI

# Runs on every pull request, whatever its base branch, and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow may read the repository and nothing else.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1, pinned to a commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        # actions/setup-node v7.1.0, pinned to a commit SHA.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run every check
        run: npm run check

  audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      # Reads the lockfile only. Installs nothing and runs no package scripts.
      - name: Audit the lockfile
        run: npm audit --audit-level=high
