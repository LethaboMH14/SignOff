# Weekly update proposals for npm packages and for the GitHub Actions pinned in ci.yml.
# Every proposal still runs through the same CI checks as any other pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # Gate 0 intentionally targets Node 24 and TypeScript 6. TypeScript 7 is outside
    # the current typescript-eslint peer range. Treat major migrations as planned
    # compatibility work with explicit review, not routine grouped updates.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
